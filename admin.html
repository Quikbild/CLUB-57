<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club 57 — Bookings (Owner)</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --green:#2E8B3D;
    --green-light:#4CAF50;
    --green-pale:#E8F5E9;
    --green-dim:#1F6B2C;
    --ink:#1F2A20;
    --ink-soft:#6B7A6D;
    --line:#DCE7DD;
    --bg:#F5FAF5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'DM Sans', sans-serif;
    background:var(--bg);
    color:var(--ink);
  }

  /* ===== Password gate ===== */
  .gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .gate-box{
    background:white;
    border-radius:16px;
    border:1px solid var(--line);
    padding:32px;
    width:100%;
    max-width:340px;
    text-align:center;
    box-shadow:0 10px 30px rgba(31,42,32,0.08);
  }
  .gate-box h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:26px;
    letter-spacing:0.03em;
    color:var(--green);
    margin:0 0 4px;
  }
  .gate-box p{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 20px;
  }
  .gate-box input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:9px;
    font-family:inherit;
    font-size:15px;
    margin-bottom:12px;
    outline:none;
    text-align:center;
    letter-spacing:0.1em;
  }
  .gate-box input:focus{ border-color:var(--green); }
  .gate-box button{
    width:100%;
    padding:12px;
    background:var(--green);
    color:white;
    border:none;
    border-radius:9px;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  .gate-box button:hover{ background:var(--green-dim); }
  .gate-error{
    color:#C0392B;
    font-size:12.5px;
    margin-top:10px;
    display:none;
  }

  /* ===== Dashboard ===== */
  .dash{ display:none; max-width:1100px; margin:0 auto; padding:28px 20px 60px; }
  .dash-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:24px;
  }
  .dash-header h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:30px;
    letter-spacing:0.03em;
    color:var(--green);
    margin:0;
  }
  .refresh-btn{
    background:var(--green-pale);
    color:var(--green-dim);
    border:none;
    padding:9px 16px;
    border-radius:9px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .refresh-btn:hover{ background:#D7EDD8; }

  .stat-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:22px;
  }
  .stat{
    background:white;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
  }
  .stat-label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .stat-value{ font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(--green); }

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .controls input, .controls select{
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:9px;
    font-family:inherit;
    font-size:13.5px;
    outline:none;
    background:white;
  }
  .controls input{ flex:1; min-width:200px; }
  .controls input:focus, .controls select:focus{ border-color:var(--green); }

  .booking-list{ display:flex; flex-direction:column; gap:10px; }
  .booking-card{
    background:white;
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:14px;
    align-items:center;
  }
  .b-id{ font-weight:700; font-size:13.5px; color:var(--green-dim); }
  .b-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .b-name{ font-weight:600; font-size:14px; }
  .b-amount{ text-align:right; }
  .b-amount .paid{ font-weight:700; font-size:14.5px; }
  .b-amount .bal{ font-size:12px; color:var(--ink-soft); }
  .status-pill{
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:100px;
    background:var(--green-pale);
    color:var(--green-dim);
    display:inline-block;
    margin-top:6px;
  }

  .empty, .loading{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }

  @media (max-width:720px){
    .booking-card{ grid-template-columns:1fr 1fr; }
    .b-amount{ text-align:left; }
    .stat-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="gate" id="gateView">
  <div class="gate-box">
    <h1>CLUB 57</h1>
    <p>Owner access — enter password to view bookings</p>
    <input type="password" id="pwInput" placeholder="Password" autofocus>
    <button onclick="tryUnlock()">Unlock</button>
    <div class="gate-error" id="gateError">Incorrect password. Try again.</div>
  </div>
</div>

<div class="dash" id="dashView">
  <div class="dash-header">
    <h1>Bookings</h1>
    <button class="refresh-btn" onclick="loadBookings()">↻ Refresh</button>
  </div>

  <div class="stat-row">
    <div class="stat"><div class="stat-label">Today's bookings</div><div class="stat-value" id="statTodayCount">0</div></div>
    <div class="stat"><div class="stat-label">Today's revenue (paid online)</div><div class="stat-value" id="statTodayRevenue">₹0</div></div>
    <div class="stat"><div class="stat-label">Total bookings on record</div><div class="stat-value" id="statTotalCount">0</div></div>
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search by Booking ID or name..." oninput="renderBookings()">
    <select id="facilityFilter" onchange="renderBookings()">
      <option value="">All facilities</option>
      <option value="1">Turf</option>
      <option value="2">Pool</option>
      <option value="3">Pickleball</option>
    </select>
  </div>

  <div id="listArea"><div class="loading">Loading bookings…</div></div>
</div>

<script>
// ⚠️ This is a simple client-side gate to keep casual visitors out — it is NOT secure
// against someone determined (anyone can view the page source and find the password).
// It's adequate for "keep random customers from poking around," not for protecting
// sensitive data. If this ever needs real security, it should move to proper server-side
// auth (e.g. Supabase Auth) instead of a hardcoded password check.
const ADMIN_PASSWORD = 'club57owner';

function tryUnlock(){
  const val = document.getElementById('pwInput').value;
  if (val === ADMIN_PASSWORD){
    document.getElementById('gateView').style.display = 'none';
    document.getElementById('dashView').style.display = 'block';
    initDashboard();
  } else {
    document.getElementById('gateError').style.display = 'block';
  }
}
document.getElementById('pwInput').addEventListener('keydown', (e)=>{
  if (e.key === 'Enter') tryUnlock();
});

const SUPABASE_URL = 'https://hjfmnhmesfjhuifzxhvp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqZm1uaG1lc2ZqaHVpZnp4aHZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MDA1OTQsImV4cCI6MjEwMDI3NjU5NH0.cWwZGxRfGWPjS7CVewhYDOic92jLoaDMzi2SRpR7yVI';
const FACILITY_NAMES = { 1:'Turf', 2:'Pool', 3:'Pickleball' };

let sbClient = null;
let allBookings = [];

function initDashboard(){
  const { createClient } = supabase;
  sbClient = createClient(SUPABASE_URL, SUPABASE_KEY);
  loadBookings();
}

async function loadBookings(){
  document.getElementById('listArea').innerHTML = '<div class="loading">Loading bookings…</div>';
  const { data, error } = await sbClient
    .from('bookings')
    .select('*')
    .order('created_at', { ascending: false });

  if (error){
    document.getElementById('listArea').innerHTML = `<div class="empty">Couldn't load bookings — check your connection and try refreshing.</div>`;
    return;
  }
  allBookings = data || [];
  renderStats();
  renderBookings();
}

function renderStats(){
  const todayStr = new Date().toISOString().split('T')[0];
  const todayBookings = allBookings.filter(b => b.date === todayStr);
  const todayRevenue = todayBookings.reduce((s,b) => s + (b.advance_amount || 0), 0);

  document.getElementById('statTodayCount').textContent = todayBookings.length;
  document.getElementById('statTodayRevenue').textContent = `₹${todayRevenue}`;
  document.getElementById('statTotalCount').textContent = allBookings.length;
}

function renderBookings(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const facility = document.getElementById('facilityFilter').value;

  let filtered = allBookings;
  if (facility) filtered = filtered.filter(b => String(b.court) === facility);
  if (q) filtered = filtered.filter(b =>
    (b.id || '').toLowerCase().includes(q) || (b.name || '').toLowerCase().includes(q)
  );

  const listArea = document.getElementById('listArea');
  if (filtered.length === 0){
    listArea.innerHTML = '<div class="empty">No bookings match.</div>';
    return;
  }

  listArea.innerHTML = `<div class="booking-list">${filtered.map(bookingCard).join('')}</div>`;
}

function bookingCard(b){
  const dateFmt = b.date ? new Date(b.date + 'T00:00:00').toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '—';
  return `
    <div class="booking-card">
      <div>
        <div class="b-id">${b.id || '—'}</div>
        <div class="b-sub">${FACILITY_NAMES[b.court] || b.facility_name || '—'}</div>
      </div>
      <div>
        <div class="b-name">${b.name || '—'}</div>
        <div class="b-sub">${b.phone || '—'}</div>
      </div>
      <div>
        <div class="b-name">${dateFmt}</div>
        <div class="b-sub">${b.slot_label || ''} ${b.slot_end ? '– ' + b.slot_end : ''}</div>
      </div>
      <div class="b-amount">
        <div class="paid">₹${b.advance_amount ?? 0} paid</div>
        <div class="bal">₹${b.balance_amount ?? 0} due at venue</div>
        <div class="status-pill">${b.status || 'confirmed'}</div>
      </div>
    </div>`;
}
</script>

</body>
</html>
